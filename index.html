<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0c10">
<title>Workout Tracker</title>
<style>
  :root {
    --bg: #0a0c10; --surface: #14171f; --surface2: #1b202b;
    --ink: #f4f6f8; --muted: #8b93a3; --line: rgba(255,255,255,.07);
    --lime: #d7f651; --lime-ink: #12150a; --sky: #8ec5f0;
    --red: #ff4d5e; --amber: #f5c344;
    --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.5;
    /* Normales Dokument mit fixierter Nav (funktioniert auf langen Seiten zuverlässig).
       min-height sorgt dafür, dass auch KURZE Seiten die volle Höhe haben — nur dann
       liegt der untere Rand des Layout-Viewports wirklich am Bildschirmrand. */
    min-height: 100vh; min-height: 100dvh;
  }
  button { font: inherit; color: inherit; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; gap: 10px; min-height: 54px;
  }
  header .back {
    border: none; background: var(--surface2); color: var(--ink);
    border-radius: 99px; width: 36px; height: 36px; flex-shrink: 0;
    font-size: 18px; font-weight: 700; line-height: 1;
  }
  header h1 {
    font-size: 16px; margin: 0; flex: 1; min-width: 0; font-weight: 800;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .2px;
  }
  #syncDot {
    font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 99px;
    background: var(--surface2); color: var(--muted); white-space: nowrap; flex-shrink: 0;
  }
  #syncDot.ok { color: var(--lime); }
  #syncDot.pending { color: var(--amber); }
  #syncDot.err { color: var(--red); }

  main {
    width: 100%; max-width: 640px; margin: 0 auto;
    /* unten genau so viel Platz, wie die fixierte Nav-Leiste hoch ist */
    padding: 16px 16px calc(66px + max(10px, env(safe-area-inset-bottom)));
  }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(145deg, var(--surface2), var(--surface));
    border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 20px; display: flex; align-items: center; gap: 18px; margin-bottom: 14px;
  }
  .hero .ringwrap { position: relative; width: 108px; height: 108px; flex-shrink: 0; }
  .hero .ringwrap .mid {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .hero .mid b { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
  .hero .mid span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .hero .txt { min-width: 0; }
  .hero .txt .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; font-weight: 700; }
  .hero .txt .v { font-size: 21px; font-weight: 800; margin: 2px 0 6px; letter-spacing: -.3px; }
  .hero .txt .s { font-size: 13px; color: var(--muted); }
  .ring { transform: rotate(-90deg); }
  .ring .bgc { stroke: rgba(255,255,255,.08); }
  .ring .fgc { stroke: var(--lime); stroke-linecap: round; transition: stroke-dashoffset .4s; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 13px 14px;
  }
  .stat b { font-size: 20px; font-weight: 800; display: block; letter-spacing: -.3px; }
  .stat span { font-size: 12px; color: var(--muted); }

  h2.section {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); margin: 24px 2px 10px; font-weight: 800;
  }
  h2.section em { color: var(--lime); font-style: normal; }

  /* ---------- Cards / Grid ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 14px; text-align: left; color: var(--ink); width: 100%;
  }
  .wk { display: flex; flex-direction: column; gap: 10px; }
  .wk .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .wk .t { font-weight: 800; font-size: 15px; }
  .wk .f { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .wk .mini { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
  .wk .mini .mp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 800; color: var(--muted); }
  .wk.done { border-color: color-mix(in srgb, var(--lime) 45%, transparent); }
  .wk.done .mini .mp { color: var(--lime); }

  .dayrow { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .dayrow .info { flex: 1; min-width: 0; }
  .dayrow .t { font-weight: 800; font-size: 15px; }
  .dayrow .sess { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .dayrow .mini { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
  .dayrow .mini .mp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 800; color: var(--muted); }
  .dayrow.done { border-color: color-mix(in srgb, var(--lime) 45%, transparent); }
  .dayrow.done .mini .mp { color: var(--lime); }

  /* ---------- Day view ---------- */
  .sesshead { display: flex; align-items: center; margin: 22px 2px 10px; gap: 10px; }
  .sesshead h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.4px;
    color: var(--lime); margin: 0; flex: 1; min-width: 0; font-weight: 800;
  }
  .sesshead button {
    border: 1px solid var(--line); background: var(--surface2); color: var(--muted);
    border-radius: 99px; padding: 6px 12px; font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .item { display: block; margin-bottom: 10px; padding: 14px; border-radius: var(--r-md); }
  .item .head { display: flex; gap: 12px; align-items: flex-start; }
  .cb {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 99px;
    border: 2px solid #3a4152; background: none; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: transparent; padding: 0;
  }
  .item.checked { opacity: .82; }
  .item.checked .cb { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
  .item.checked .tt { color: var(--muted); text-decoration: line-through; }
  .item .tt { font-weight: 800; font-size: 15px; }
  .item .st { font-weight: 600; font-size: 14px; margin-top: 1px; color: #c9cfda; }
  .item.checked .st { color: var(--muted); }
  .item .body { color: var(--muted); font-size: 14px; white-space: pre-line; margin: 9px 0 0 42px; }
  .item .body .mv { color: #c9cfda; font-weight: 600; }
  .item.checked .body { display: none; }
  .res { margin: 11px 0 0 42px; }
  .res input {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 10px 12px;
  }
  .res input:focus { outline: none; border-color: color-mix(in srgb, var(--lime) 55%, transparent); }
  .res .last { margin-top: 7px; }
  .res .last button {
    border: 1px dashed #3a4152; background: none; color: var(--lime);
    border-radius: 99px; padding: 5px 11px; font-size: 12.5px; font-weight: 700; text-align: left;
  }
  .res details { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .res summary { cursor: pointer; }
  /* ---------- Übungszeilen mit Gewichtseingabe ---------- */
  .exs { margin: 10px 0 0 42px; display: flex; flex-direction: column; gap: 9px; }
  .ex { border-top: 1px solid var(--line); padding-top: 9px; }
  .ex:first-child { border-top: none; padding-top: 0; }
  .exrow { display: flex; align-items: center; gap: 10px; }
  .exname { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; }
  .exw {
    width: 104px; flex-shrink: 0; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 10px; text-align: right;
  }
  .exw:focus { outline: none; border-color: color-mix(in srgb, var(--lime) 55%, transparent); }
  .exnote { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .exset { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .exset .sl { font-size: 11.5px; color: var(--muted); font-weight: 700; flex: 1; min-width: 0; }
  .exset .su { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .exn {
    width: 68px; flex-shrink: 0; font: inherit; font-size: 16px; color: var(--ink); text-align: right;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px;
  }
  .exn:focus { outline: none; border-color: color-mix(in srgb, var(--lime) 55%, transparent); }
  .exok { font-size: 15px; font-weight: 800; flex-shrink: 0; }
  .exok.yes { color: var(--lime); }
  .exok.no { color: var(--amber); }
  @media (max-width: 370px) { .exn { width: 60px; } .exset .sl { font-size: 11px; } }
  .expre { color: var(--lime); font-size: 12.5px; font-weight: 700; margin-top: 3px; opacity: .9; }
  .rmgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .rmcell span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .exsec {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; font-weight: 800;
    color: var(--muted); margin: 14px 0 2px; padding-top: 10px; border-top: 1px dashed #3a4152;
  }
  .ex.hassec { border-top: none; padding-top: 0; }
  .ghead {
    display: flex; align-items: center; gap: 10px;
    margin: 14px 0 2px; padding-top: 12px; border-top: 1px dashed #3a4152;
  }
  .ghead:first-child { border-top: none; padding-top: 0; margin-top: 2px; }
  .ghead span {
    flex: 1; min-width: 0; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.4px; font-weight: 800; color: var(--muted);
  }
  .ghead.done span { color: var(--lime); }
  .gcb {
    width: 26px; height: 26px; border-radius: 99px; border: 2px solid #3a4152;
    background: none; color: transparent; font-size: 14px;
    display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0;
  }
  .ghead.done .gcb { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
  .ghead + .ex { border-top: none; padding-top: 0; }
  .exlast {
    border: 1px dashed #3a4152; background: none; color: var(--lime);
    border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 700;
    margin-top: 5px; text-align: left;
  }
  .item.checked .exnote { display: none; }
  /* eigene Ergänzungen — klar vom Originaltext des Plans getrennt */
  .own {
    margin: 10px 0 0 42px; padding: 9px 12px; font-size: 13.5px; color: #c9cfda;
    background: color-mix(in srgb, var(--lime) 7%, var(--bg));
    border-left: 2px solid var(--lime); border-radius: 0 var(--r-sm) var(--r-sm) 0;
  }
  .own b {
    display: block; font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--lime); font-weight: 800; margin-bottom: 3px;
  }
  .item.checked .own { display: none; }
  .rest { text-align: center; padding: 34px 14px; color: var(--muted); }
  .rest .z { font-size: 36px; }
  .flash { animation: flash 1.6s ease-out 1; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--lime); } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* ---------- Tagesplanung ---------- */
  .today {
    background: linear-gradient(145deg, var(--surface2), var(--surface));
    border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 16px 18px; margin-bottom: 14px;
  }
  .today .thead { display: flex; align-items: flex-start; gap: 8px; margin-right: -6px; }
  .today .thead .k { flex: 1; min-width: 0; padding-top: 2px; }
  .today .k { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--lime); font-weight: 800; }
  .today.quiet .k { color: var(--muted); }
  .today.sel { border-color: var(--lime); }
  .today .v { font-size: 19px; font-weight: 800; margin: 4px 0 2px; letter-spacing: -.3px; }
  .today .s { font-size: 13px; color: var(--muted); }
  .today .cta {
    display: block; width: 100%; margin-top: 14px; border: none; border-radius: 99px;
    background: var(--lime); color: var(--lime-ink); font-size: 15px; font-weight: 800; padding: 12px;
  }
  .today .cta.ghost { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); font-size: 13.5px; padding: 10px; }
  .pd {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--line); padding: 11px 2px;
  }
  .pd:last-of-type { border-bottom: none; }
  .pd .dt { width: 38px; flex-shrink: 0; }
  .pd .dt .wd { font-size: 11px; color: var(--muted); font-weight: 700; line-height: 1.2; }
  .pd .dt .dn { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .pd .inf { flex: 1; min-width: 0; }
  .pd .inf .t { font-size: 14px; font-weight: 800; }
  .pd .inf .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pd .tag {
    font-size: 10.5px; font-weight: 800; color: var(--muted); background: var(--surface2);
    border-radius: 99px; padding: 3px 9px; flex-shrink: 0;
  }
  .dots { color: var(--muted); font-size: 17px; font-weight: 800; padding: 4px 8px; flex-shrink: 0; }
  .pd.muted .dt .dn { color: var(--muted); font-weight: 700; }
  .pd.muted .inf .t { color: var(--muted); font-weight: 700; }
  .pd.off .inf .t { text-decoration: line-through; }
  .pd.sel { background: var(--surface2); border-radius: var(--r-sm); border-bottom-color: transparent; }
  .planfoot { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 14px; }
  .planhint {
    border-left: 2px solid var(--lime); background: var(--surface);
    border-radius: 0; padding: 9px 12px; margin-top: 12px; font-size: 12px; color: var(--muted);
  }
  .swapbar {
    background: var(--surface2); border: 1px dashed var(--lime); border-radius: var(--r-md);
    padding: 11px 13px; margin-bottom: 12px; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  .swapbar span { min-width: 0; }
  .swapbar button { margin-left: auto; border: none; background: none; color: var(--muted); font-weight: 800; font-size: 13px; flex-shrink: 0; }
  .sheetwrap { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; }
  .sheet {
    background: var(--surface); width: 100%; max-width: 640px; margin: 0 auto;
    border-radius: var(--r-lg) var(--r-lg) 0 0; border-top: 1px solid var(--line);
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .sheet h4 { margin: 0 0 3px; font-size: 15px; font-weight: 800; }
  .sheet p { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }
  .sheet button {
    display: block; width: 100%; border: 1px solid var(--line); background: var(--surface2);
    color: var(--ink); border-radius: var(--r-md); padding: 13px; font-size: 15px; font-weight: 800;
    margin-bottom: 8px; text-align: left;
  }
  .sheet button small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 3px; }
  .sheet button.cancel { text-align: center; background: none; border: none; color: var(--muted); margin: 4px 0 0; }

  /* ---------- Stufenleitern ---------- */
  .pdw { border-bottom: 1px solid var(--line); }
  .pdw:last-of-type { border-bottom: none; }
  .pdw .pd { border-bottom: none; }
  .xrow {
    margin: 0 0 9px 44px; font-size: 11.5px; font-weight: 700; color: var(--sky);
  }
  .xrow.done { color: var(--muted); }
  .xrow .q { color: var(--muted); font-weight: 600; }
  .today .cta.xcta {
    margin-top: 7px; background: none; border: 1px solid color-mix(in srgb, var(--sky) 55%, transparent);
    color: var(--sky); font-size: 12.5px; padding: 9px;
  }
  .today .cta.xcta.done { border-color: var(--line); color: var(--muted); }
  .tcard {
    background: linear-gradient(145deg, var(--surface2), var(--surface));
    border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; margin-bottom: 4px;
  }
  .tcard .thead2 { display: flex; align-items: baseline; gap: 8px; }
  .tcard .k {
    flex: 1; min-width: 0; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--sky); font-weight: 800;
  }
  .tcard .q { color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .tcard .v { font-size: 17px; font-weight: 800; margin: 4px 0 2px; letter-spacing: -.3px; }
  .tcard .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .tcard .s.hi { color: var(--ink); font-weight: 700; margin-top: 7px; }
  .bar { margin-top: 11px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; }
  .bar div { height: 100%; background: var(--sky); transition: width .3s; }
  .tnote {
    font-size: 12px; color: var(--muted); border-left: 2px solid var(--line);
    padding: 8px 11px; margin: 8px 0 2px;
  }
  .setrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .setrow .lbl { font-size: 12.5px; color: var(--muted); width: 52px; flex-shrink: 0; font-weight: 700; }
  .setrow input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); text-align: right;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px;
  }
  .setrow input:focus { outline: none; border-color: color-mix(in srgb, var(--sky) 55%, transparent); }
  .setrow select {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px;
  }
  .setrow .u { font-size: 12px; color: var(--muted); width: 30px; flex-shrink: 0; }
  .setrow .q { font-size: 11px; color: var(--muted); width: 66px; text-align: right; flex-shrink: 0; }
  .tsave {
    display: block; width: 100%; margin-top: 14px; border: none; border-radius: 99px;
    background: var(--lime); color: var(--lime-ink); font-size: 15px; font-weight: 800; padding: 13px;
  }
  .lrow { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .lrow:first-of-type { border-top: none; }
  .lrow .q { color: var(--muted); font-size: 11.5px; width: 60px; flex-shrink: 0; }
  .lrow .vals { color: var(--ink); font-weight: 700; }

  /* ---------- Bottom Nav ---------- */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    /* Raster: 2 Tabs · freie Mittelspalte für den runden Button · 2 Tabs.
       minmax(0,…) verhindert, dass ein breites Label die Spalten verschiebt. */
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 68px minmax(0, 1fr) minmax(0, 1fr);
    align-items: center; justify-items: center;
    /* unten NUR die Home-Indicator-Zone (kein zusätzlicher Eigenabstand) */
    padding: 10px 6px max(10px, env(safe-area-inset-bottom));
  }
  nav button { border: none; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 700; letter-spacing: .2px; padding: 2px 2px; white-space: nowrap; }
  #navHome { grid-column: 1; }
  #navWeek { grid-column: 2; }
  #navStats { grid-column: 4; }
  #navSet { grid-column: 5; }
  @media (max-width: 370px) {
    nav { grid-template-columns: minmax(0,1fr) minmax(0,1fr) 62px minmax(0,1fr) minmax(0,1fr); padding-left: 2px; padding-right: 2px; }
    nav button { font-size: 8.5px; letter-spacing: 0; padding: 2px 0; }
    nav button svg { width: 20px; height: 20px; }
  }

  nav .go {
    /* exakt auf die Bildschirmmitte gesetzt — unabhängig von den Label-Breiten */

  nav .go svg { width: 24px; height: 24px; stroke-width: 2.4; }

  /* ---------- Setup / Settings ---------- */
  .set label, .setup label { display: block; font-weight: 800; margin: 18px 0 7px; font-size: 14px; }

  .set .row button.danger { color: #fff; background: #8f1d24; }

  /* ---------- Einstellungen: Bereiche ---------- */

  .setsec summary::-webkit-details-marker { display: none; }

  /* ---------- Analyse ---------- */
  .motto {

  .lift .ln { font-size: 12px; color: var(--muted); font-weight: 700; }
  .lift .lv { font-size: 21px; font-weight: 800; margin: 2px 0 4px; letter-spacing: -.3px; }
  .lift .spark { display: block; margin-top: 8px; max-width: 100%; }
  .sparkempty { color: var(--muted); font-size: 11.5px; margin-top: 10px; border-top: 1px dashed #3a4152; padding-top: 8px; }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 99px; padding: 2.5px 9px; }
  .chip.up { color: var(--lime); background: rgba(215, 246, 81, .13); }

</style>

<body>
<header>
  <button class="back" id="backBtn" style="display:none" aria-label="Zurück">‹</button>
  <h1 id="title">Workout Tracker</h1>
  <span id="syncDot" style="display:none">●</span>
</header>
<main id="main"><div class="loading">Lade…</div></main>
<nav id="nav" style="display:none">
  <button id="navHome"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Übersicht</button>
  <button id="navWeek"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>Woche</button>
  <button class="go" id="navGo" aria-label="Weitermachen"><svg viewBox="0 0 24 24"><path d="M7 4.5 19 12 7 19.5z"/></svg></button>
  <button id="navStats"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Analyse</button>
  <button id="navSet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.8 7.8 0 0 0 0-3l2-1.5-2-3.4-2.4 1a7.8 7.8 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.6A7.8 7.8 0 0 0 7 6.6l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0 0 3l-2 1.5 2 3.4 2.4-1a7.8 7.8 0 0 0 2.6 1.5l.4 2.6h4l.4-2.6a7.8 7.8 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg>Einstellungen</button>
</nav>

<script>
"use strict";
/* ============================================================
   Workout Tracker — generische App-Hülle (keine Plandaten!)
   Datenquellen:
   1) Lokaler Modus:  ./data.json neben dieser Datei (nur Dev)
   2) GitHub-Modus:   privates Repo via Contents API
      - data.json     (Plan, read-only)
      - progress.json (Fortschritt, read/write)
   ============================================================ */

const CFG_KEY = "wt-config-v1";
const CACHE_KEY = "wt-progress-cache-v1";
const DIRTY_KEY = "wt-dirty-v1";
const DATA_KEY = "wt-data-cache-v1";

let PROGRAM = null, PLAN_TITLE = "Workout Tracker", TRACKS = [];
let S = { checked: {}, resultsByItem: {}, results: {} };
let FLAT = [];
let mode = null;              // "local" | "github"
let cfg = null;               // {user, repo, token}
let progressSha = null;
let syncTimer = null;
let syncState = "idle";

let storageOK = true;
try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { storageOK = false; }

function lsGet(k) { if (!storageOK) return null; try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { if (!storageOK) return; try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { if (!storageOK) return; try { localStorage.removeItem(k); } catch (e) {} }

/* ---------- GitHub Contents API ---------- */
function ghUrl(path) { return `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${path}`; }
function ghHeaders(extra) {
  return Object.assign({
    "Authorization": "Bearer " + cfg.token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  }, extra || {});
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\n/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}
async function ghGet(path) {
  const r = await fetch(ghUrl(path), { headers: ghHeaders() });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("GitHub " + r.status + (r.status === 401 ? " – Token ungültig?" : r.status === 403 ? " – keine Berechtigung / Rate-Limit" : ""));
  const j = await r.json();
  return { text: b64decode(j.content), sha: j.sha };
}
async function ghPut(path, text, sha, message) {
  const body = { message: message || "update " + path, content: b64encode(text) };
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(path), { method: "PUT", headers: ghHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
  if (!r.ok) { const e = new Error("GitHub PUT " + r.status); e.status = r.status; throw e; }
  const j = await r.json();
  return j.content.sha;
}

/* ---------- Sync ---------- */
function setSync(state, titleTxt) {
  syncState = state;
  const el = document.getElementById("syncDot");
  if (mode !== "github") { el.style.display = "none"; return; }
  el.style.display = "";
  el.className = "";
  if (state === "ok") { el.classList.add("ok"); el.textContent = "✓ synchron"; }
  else if (state === "pending" || state === "syncing") { el.classList.add("pending"); el.textContent = state === "syncing" ? "↻ sync…" : "● ungesichert"; }
  else if (state === "err") { el.classList.add("err"); el.textContent = "⚠︎ offline"; }
  else { el.textContent = "●"; }
  el.title = titleTxt || "";
}
function markDirty() {
  lsSet(CACHE_KEY, JSON.stringify(S));
  if (mode !== "github") return;
  lsSet(DIRTY_KEY, "1");
  setSync("pending");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushProgress, 4000);
}
async function pushProgress() {
  if (mode !== "github" || !lsGet(DIRTY_KEY)) return;
  clearTimeout(syncTimer);
  setSync("syncing");
  try {
    progressSha = await ghPut("progress.json", JSON.stringify(S, null, 1), progressSha, "progress update");
    lsDel(DIRTY_KEY);
    setSync("ok");
  } catch (e) {
    if (e.status === 409 || e.status === 422) {
      try {
        const cur = await ghGet("progress.json");
        progressSha = cur ? cur.sha : null;
        progressSha = await ghPut("progress.json", JSON.stringify(S, null, 1), progressSha, "progress update (merge)");
        lsDel(DIRTY_KEY);
        setSync("ok");
        return;
      } catch (e2) { /* fällt durch */ }
    }
    setSync("err", String(e.message || e));
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushProgress, 30000);
  }
}
window.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") pushProgress(); });
window.addEventListener("online", () => pushProgress());

/* ---------- Boot ---------- */
async function boot() {
  try {
    const r = await fetch("./data.json", { cache: "no-store" });
    if (r.ok) {
      const data = await r.json();
      PROGRAM = data.program; PLAN_TITLE = data.title || PLAN_TITLE; TRACKS = data.tracks || [];
      mode = "local";
      const cached = lsGet(CACHE_KEY);
      if (cached) try { S = Object.assign(S, JSON.parse(cached)); } catch (e) {}
      finishBoot();
      return;
    }
  } catch (e) { /* kein lokales data.json */ }

  const rawCfg = lsGet(CFG_KEY);
  if (rawCfg) try { cfg = JSON.parse(rawCfg); } catch (e) {}
  if (!cfg || !cfg.user || !cfg.repo || !cfg.token) { renderSetup(); return; }
  mode = "github";

  // Schnellstart: sofort aus dem lokalen Cache rendern, GitHub im Hintergrund nachziehen
  const cachedData = lsGet(DATA_KEY);
  if (cachedData) {
    try {
      const data = JSON.parse(cachedData);
      PROGRAM = data.program; PLAN_TITLE = data.title || PLAN_TITLE; TRACKS = data.tracks || [];
      const cached = lsGet(CACHE_KEY);
      if (cached) try { S = Object.assign(S, JSON.parse(cached)); } catch (e) {}
      finishBoot();
      refreshFromGitHub();
      return;
    } catch (e) { /* Cache defekt → normal laden */ }
  }
  await loadFromGitHub();
}

async function refreshFromGitHub() {
  try {
    const dataFile = await ghGet("data.json");
    if (dataFile && dataFile.text !== lsGet(DATA_KEY)) {
      lsSet(DATA_KEY, dataFile.text);
      const data = JSON.parse(dataFile.text);
      PROGRAM = data.program; PLAN_TITLE = data.title || PLAN_TITLE; TRACKS = data.tracks || [];
      finishBoot();
    }
    const progFile = await ghGet("progress.json");
    const dirty = !!lsGet(DIRTY_KEY);
    if (progFile) {
      progressSha = progFile.sha;
      if (dirty) { pushProgress(); return; }
      const serverS = JSON.stringify(Object.assign({ checked: {}, resultsByItem: {}, results: {} }, JSON.parse(progFile.text)));
      if (serverS !== JSON.stringify(S)) {
        S = JSON.parse(serverS);
        lsSet(CACHE_KEY, serverS);
        render();
      }
      setSync("ok");
    } else {
      progressSha = null;
      if (dirty) pushProgress();
    }
  } catch (e) {
    setSync("err", String(e.message || e));
  }
}

async function loadFromGitHub() {
  document.getElementById("main").innerHTML = '<div class="loading">Lade Trainingsplan…</div>';
  try {
    const dataFile = await ghGet("data.json");
    if (!dataFile) throw new Error("data.json nicht im Repo gefunden");
    lsSet(DATA_KEY, dataFile.text);
    const data = JSON.parse(dataFile.text);
    PROGRAM = data.program; PLAN_TITLE = data.title || PLAN_TITLE; TRACKS = data.tracks || [];

    const progFile = await ghGet("progress.json");
    const dirty = !!lsGet(DIRTY_KEY);
    const cached = lsGet(CACHE_KEY);
    if (progFile) {
      progressSha = progFile.sha;
      if (dirty && cached) {
        try { S = JSON.parse(cached); } catch (e) { S = JSON.parse(progFile.text); }
        pushProgress();
      } else {
        S = Object.assign({ checked: {}, resultsByItem: {}, results: {} }, JSON.parse(progFile.text));
        lsSet(CACHE_KEY, JSON.stringify(S));
        setSync("ok");
      }
    } else {
      progressSha = null;
      if (cached) try { S = JSON.parse(cached); } catch (e) {}
      lsSet(DIRTY_KEY, "1");
      pushProgress();
    }
    finishBoot();
  } catch (e) {
    renderSetup("Laden fehlgeschlagen: " + (e.message || e));
  }
}

let ITEM_INDEX = {};
function finishBoot() {
  FLAT = [];
  ITEM_INDEX = {};
  PROGRAM.forEach((part, pi) => part.weeks.forEach((week, wi) => week.days.forEach((day, di) => {
    day.sessions.forEach(sess => sess.items.forEach(item => {
      ITEM_INDEX[item.id] = item;
      if (!item.rest) FLAT.push({ item, pi, wi, di });
    }));
  })));
  document.getElementById("nav").style.display = "";
  prunePlan();
  setSync(mode === "github" ? (lsGet(DIRTY_KEY) ? "pending" : "ok") : "idle");
  render();
}

/* ---------- Helpers ---------- */
function dayItems(day) { return day.sessions.flatMap(s => s.items).filter(i => !i.rest); }
function countDone(items) { return items.filter(i => S.checked[i.id]).length; }
function weekItems(week) { return week.days.flatMap(dayItems); }
function pct(done, total) { return total ? Math.round(done / total * 100) : 0; }
function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function fmtBody(s) {
  return esc(s).split("\n").map(line =>
    /^- /.test(line.trim()) ? `<span class="mv">${line}</span>` : line
  ).join("\n");
}
function fmtDate(iso) { const d = new Date(iso); return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" }); }
const RM_KEYS = [
  ["squat", "Front Squat (Squat-1RM)"],
  ["bench", "Bench Press"],
  ["deadlift", "Deadlift"],
  ["ohp", "Push Press (OHP)"]
];
function mround25(x) { return Math.round(x / 2.5) * 2.5; }
function fmtW(x) { return (Math.round(x * 10) / 10).toLocaleString("de-DE"); }
function prescription(ex) {
  if (!ex.rm || !ex.pct) return null;
  const base = parseFloat((S.oneRM || {})[ex.rm]);
  if (!base || base <= 0) return null;
  const w = ex.pct.map(p => fmtW(mround25(base * p))).join("–") + " kg";
  const p = ex.pct.map(x => (x * 100).toLocaleString("de-DE")).join("–") + " % 1RM";
  return w + " · " + p;
}
function exGroups(item) {
  const gs = [];
  (item.exercises || []).forEach(ex => {
    const acc = ex.k.startsWith("ex-");
    const gk = acc ? "acc" : (ex.rm || ex.k);
    const last = gs[gs.length - 1];
    if (last && last.gk === gk) last.exs.push(ex);
    else gs.push({ gk, acc, exs: [ex] });
  });
  gs.forEach((g, gi) => {
    g.id = item.id + "/g" + gi + "-" + g.gk;
    g.label = g.acc ? "Accessory Work" : g.exs[0].name.replace(/\s+\d+x.*$/i, "");
  });
  return gs;
}
function locOf(id) {
  const baseId = id.split("/")[0];
  const f = FLAT.find(x => x.item.id === baseId);
  if (!f) return "";
  const p = PROGRAM[f.pi];
  return `${p.name} · ${p.weeks[f.wi].name} · ${p.weeks[f.wi].days[f.di].label}`;
}
function logEv(e, id, extra) {
  (S.log = S.log || []).push(Object.assign({ t: new Date().toISOString(), e, id, loc: locOf(id), run: S.run || 1 }, extra || {}));
}
function lastResult(key, selfId) {
  const arr = S.results[key] || [];
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i].itemId !== selfId) return arr[i];
  return arr.length ? arr[arr.length - 1] : null;
}
function ring(p, size, stroke, cls) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg class="ring ${cls || ""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="bgc" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/>
    <circle class="fgc" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}"/>
  </svg>`;
}

/* ---------- Tagesplanung ----------
   Grundsatz: Es wird KEIN Termin gespeichert. Gespeichert sind nur die Ausnahmen
   (off / force / dropped / swaps); welche Einheit an welchem Tag liegt, wird bei
   jedem Rendern neu berechnet. Dadurch rutscht alles von selbst nach, wenn ein
   Training ausfällt — es gibt nichts zu reparieren.                            */
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const MAX_STREAK = 6;                       // nie mehr als 6 Trainingstage am Stück

function planState() {
  if (!S.plan || typeof S.plan !== "object") S.plan = {};
  const P = S.plan;
  if (!Array.isArray(P.off)) P.off = [];        // "YYYY-MM-DD" — geht nicht
  if (!Array.isArray(P.force)) P.force = [];    // "YYYY-MM-DD" — Ruhetag überstimmt
  if (!Array.isArray(P.dropped)) P.dropped = [];// "pi.wi.di"   — gestrichene Einheit
  if (!Array.isArray(P.swaps)) P.swaps = [];    // [["pi.wi.di","pi.wi.di"], …]
  return P;
}
function dkey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
    + "-" + String(d.getDate()).padStart(2, "0");
}
function today0() { const d = new Date(); d.setHours(12, 0, 0, 0); return d; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDay(d) { return d.toLocaleDateString("de-DE", { day: "numeric", month: "short" }); }
/* Trainingstage als LOKALE Datumsschlüssel (nicht UTC — sonst kippt ein
   Abendtraining auf den Folgetag). */
function trainedDayKeys() {
  const set = new Set();
  Object.values(S.checked).forEach(t => { if (typeof t === "string") set.add(dkey(new Date(t))); });
  (S.log || []).forEach(e => { if (e.e === "done" && e.t) set.add(dkey(new Date(e.t))); });
  return set;
}
function planDays() {
  const out = [];
  PROGRAM.forEach((part, pi) => part.weeks.forEach((week, wi) => week.days.forEach((day, di) => {
    const items = dayItems(day);
    if (!items.length) return;                  // reine Rest-Tage des Plans
    out.push({ pi, wi, di, key: pi + "." + wi + "." + di, part, week, day, items });
  })));
  return out;
}
function dayTitle(d) { return d.week.name + " · " + d.day.label; }
function daySub(d) {
  const names = d.day.sessions.map(s => s.label).filter(Boolean);
  if (names.length) return names.join(" · ");
  const it = d.day.sessions[0] && d.day.sessions[0].items[0];
  return it ? (it.sub || it.title) : "";
}
function dayDone(d) { return d.items.every(i => S.checked[i.id]); }
/* Offene Einheiten in Reihenfolge, Streichungen raus, Tausche angewendet. */
function planQueue() {
  const P = planState();
  const dropped = new Set(P.dropped);
  const q = planDays().filter(d => !dropped.has(d.key) && !dayDone(d));
  P.swaps.forEach(pair => {
    const ia = q.findIndex(d => d.key === pair[0]), ib = q.findIndex(d => d.key === pair[1]);
    if (ia >= 0 && ib >= 0) { const t = q[ia]; q[ia] = q[ib]; q[ib] = t; }
  });
  return q;
}
/* Erledigte/gestrichene Tage aus den Tauschen werfen, vergangene Ausnahmen kappen. */
function prunePlan() {
  const P = planState(), t = dkey(today0());
  P.off = P.off.filter(k => k >= t);
  P.force = P.force.filter(k => k >= t);
  const byKey = {};
  planDays().forEach(d => { byKey[d.key] = d; });
  const dropped = new Set(P.dropped);
  P.swaps = P.swaps.filter(pair =>
    pair.every(k => byKey[k] && !dropped.has(k) && !dayDone(byKey[k])));
}
/* An welchem Plan-Tag wurde an diesem Datum gearbeitet? (für "heute erledigt") */
function dayWorkedOn(dateK) {
  const ids = Object.keys(S.checked).filter(id =>
    typeof S.checked[id] === "string" && dkey(new Date(S.checked[id])) === dateK);
  if (!ids.length) return null;
  let best = null, bestN = 0;
  planDays().forEach(pd => {
    const n = pd.items.filter(i => ids.indexOf(i.id) >= 0).length;
    if (n > bestN) { bestN = n; best = pd; }
  });
  return best;
}
/* Die eigentliche Projektion: n Kalendertage ab heute. */
function projectPlan(n) {
  const P = planState();
  const off = new Set(P.off), force = new Set(P.force);
  const trained = trainedDayKeys();
  const q = planQueue();
  const out = [];
  // Wie viele Trainingstage liegen unmittelbar vor heute? (für die Ruhetagsregel)
  let streak = 0, back = addDays(today0(), -1);
  while (trained.has(dkey(back)) && streak < 14) { streak++; back = addDays(back, -1); }
  let qi = 0, d = today0();
  for (let i = 0; i < n; i++) {
    const k = dkey(d);
    // Heute gilt erst als abgeschlossen, wenn die Einheit nicht mehr offen ist.
    // Ein einzelnes Häkchen macht den Tag noch nicht fertig — sonst verschwindet
    // die laufende Einheit (und ihre Zusatzarbeit) beim ersten Abhaken.
    const headOpen = i === 0 && q.length && q[0].items.some(it => S.checked[it.id]);
    if (i === 0 && trained.has(k) && !headOpen) {
      out.push({ date: new Date(d), k, kind: "donetoday", d: dayWorkedOn(k) }); streak++;
    }
    else if (off.has(k)) { out.push({ date: new Date(d), k, kind: "off" }); streak = 0; }
    else if (streak >= MAX_STREAK && !force.has(k)) { out.push({ date: new Date(d), k, kind: "rest" }); streak = 0; }
    else if (qi < q.length) { out.push({ date: new Date(d), k, kind: "train", d: q[qi++] }); streak++; }
    else out.push({ date: new Date(d), k, kind: "empty" });
    d = addDays(d, 1);
  }
  return out;
}
/* Voraussichtliches Ende: reine Projektion. Ein Plan-Tag pro verfügbarem
   Kalendertag, Ruhetagsregel und markierte Ausfalltage berücksichtigt.
   Absichtlich KEIN Durchschnitt: Wer einen Tag auslässt, verschiebt das Ende
   genau dann um einen Tag — vorher wird nichts hineingerechnet.              */
function planEnd() {
  const q = planQueue();
  if (!q.length) return null;
  const days = projectPlan(Math.min(600, q.length * 3 + 60));
  let seen = 0, last = null;
  for (let i = 0; i < days.length; i++) {
    if (days[i].kind === "train") { seen++; last = days[i].date; if (seen >= q.length) break; }
  }
  return last ? { date: last } : null;
}

/* ---------- Stufenleitern (Zusatzarbeit) ----------
   Eigenständige Progressionen neben dem Plan: eigene Stufe, eigenes Protokoll.
   Terminiert wird nicht über Datümer, sondern über den Plan selbst:
   "anchor" hängt an passenden Trainingstagen (Waden an Bein-Lifts),
   "cadence" verteilt n Einheiten pro Kalenderwoche auf die ruhigsten Tage.   */
function trackDef(id) { return (TRACKS || []).find(t => t.id === id); }
function trState(id) {
  if (!S.tracks || typeof S.tracks !== "object") S.tracks = {};
  const t = S.tracks[id] || (S.tracks[id] = {});
  if (!t.steps || typeof t.steps !== "object") t.steps = {};
  if (!Array.isArray(t.log)) t.log = [];
  if (!Array.isArray(t.hist)) t.hist = [];
  return t;
}
function trStep(trackId, partId) {
  const n = trState(trackId).steps[partId];
  return (typeof n === "number" && n > 0) ? n : 1;
}
function stepOf(part, n) { return (part.steps || []).find(s => s.n === n) || (part.steps || [])[0]; }
function weekKeyOf(d) {
  const x = new Date(d); x.setHours(12, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));   // Montag
  return dkey(x);
}
function dayGap(k1, k2) {
  return Math.abs(Math.round((new Date(k1 + "T12:00:00") - new Date(k2 + "T12:00:00")) / 864e5));
}
/* Welche Lift-Art steckt in diesem Plan-Tag? */
function dayAnchor(pd) {
  let lower = false, upper = false;
  pd.day.sessions.forEach(s => s.items.forEach(it => {
    if (it.key === "barbell-complex") { lower = true; upper = true; }
    (it.exercises || []).forEach(ex => {
      if (ex.rm === "squat" || ex.rm === "deadlift") lower = true;
      if (ex.rm === "bench" || ex.rm === "ohp") upper = true;
    });
  }));
  return { lower: lower, upper: upper };
}
function sessCount(pd) { return pd.day.sessions.filter(s => s.items.some(i => !i.rest)).length; }
/* Wie viele Einheiten dieses Tracks liegen in der Woche von dateKey schon im Log? */
function trDoneInWeek(id, dateK) {
  const wk = weekKeyOf(new Date(dateK + "T12:00:00"));
  return trState(id).log.filter(l => weekKeyOf(new Date(l.d + "T12:00:00")) === wk).length;
}
/* Zusatzarbeit auf die projizierten Tage verteilen -> { dateKey: [trackId, …] } */
function planExtras(days) {
  const out = {};
  const put = (k, id) => { out[k] = out[k] || []; if (out[k].indexOf(id) < 0) out[k].push(id); };
  // Verankerte zuerst: die haben keine Wahl. Getaktete weichen ihnen danach aus.
  const order = (TRACKS || []).slice().sort((a, b) =>
    (((a.sched || {}).mode === "anchor") ? 0 : 1) - (((b.sched || {}).mode === "anchor") ? 0 : 1));
  order.forEach(tr => {
    const sc = tr.sched || {}, perWeek = sc.perWeek || 2, minGap = sc.minGap || 1;
    const st = trState(tr.id);
    const lastLog = st.log.map(l => l.d).sort().pop() || null;
    const byWeek = {};
    days.forEach(e => {
      if (e.kind !== "train" && e.kind !== "rest" && e.kind !== "donetoday") return;
      const wk = weekKeyOf(e.date);
      (byWeek[wk] = byWeek[wk] || []).push(e);
    });
    Object.keys(byWeek).forEach(wk => {
      // Schon protokollierte Einheiten im Fenster immer zeigen (als ✓), auch wenn
      // die Wochenkappe damit erschöpft ist — sonst verliert man die Bestätigung.
      byWeek[wk].forEach(e => { if (trLoggedOn(tr.id, e.k)) put(e.k, tr.id); });
      let left = perWeek - trDoneInWeek(tr.id, byWeek[wk][0].k);
      if (left <= 0) return;
      // "heute erledigt" ist ein Trainingstag — die Zusatzarbeit gehört weiter dorthin
      const trainDays = byWeek[wk].filter(e => e.kind === "train" || e.kind === "donetoday");
      const anchorOf = e => e.d ? dayAnchor(e.d) : { lower: false, upper: false };
      let pool;
      if (sc.mode === "anchor") {
        pool = trainDays.filter(e => anchorOf(e)[sc.anchor]);
      } else {
        // Anker zuerst (dort ist die Platzierungsregel erfüllt), dann die ruhigsten Tage
        const score = e => (sc.prefer && anchorOf(e)[sc.prefer] ? 0 : 10)
          + (e.d ? sessCount(e.d) : 1) + ((out[e.k] || []).length ? 3 : 0);
        pool = trainDays.slice().sort((a, b) => score(a) - score(b) || (a.k < b.k ? -1 : 1));
      }
      pool = pool.filter(e => !trLoggedOn(tr.id, e.k));
      const chosen = [];
      const fits = k => [lastLog].concat(chosen).filter(Boolean).every(o => dayGap(o, k) > minGap);
      pool.forEach(e => { if (chosen.length < left && fits(e.k)) chosen.push(e.k); });
      // Reicht die Woche nicht, darf auch der Ruhetag ran (Zusatzarbeit ist klein)
      if (chosen.length < left && sc.mode !== "anchor") {
        byWeek[wk].filter(e => e.kind === "rest")
          .forEach(e => { if (chosen.length < left && fits(e.k)) chosen.push(e.k); });
      }
      chosen.forEach(k => put(k, tr.id));
    });
  });
  return out;
}
/* Fortschritt einer numerischen Stufe: 0–100 aus dem letzten Protokoll */
function trProgress(trackId, part) {
  const step = stepOf(part, trStep(trackId, part.id));
  if (!step || part.gate !== "numeric") return null;
  const sets = step.sets || 1, target = step.target || 1;
  const last = trLastSets(trackId, part.id);
  let sum = 0, weakest = 0;
  for (let i = 0; i < sets; i++) {
    const v = Math.max(0, +(last[i] || 0));
    sum += Math.min(v, target);
    if (i === 0 || v < weakest) weakest = v;
  }
  return {
    step: step, sets: sets, target: target, last: last,
    pct: Math.round(sum / (sets * target) * 100),
    weakest: weakest,
    missing: Math.max(0, target - weakest),
    reached: last.length >= sets && last.slice(0, sets).every(v => +v >= target)
  };
}
function trLastSets(trackId, partId) {
  const cur = trStep(trackId, partId);
  // nach Datum, nicht nach Array-Position — Einträge können nachträglich ergänzt werden
  const sorted = trState(trackId).log.slice().sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
  for (let i = sorted.length - 1; i >= 0; i--) {
    const e = sorted[i];
    if (e.sets && e.sets[partId] && (!e.steps || e.steps[partId] === cur)) return e.sets[partId].slice();
  }
  return [];
}
/* Vorbelegung: letzte Werte, +Steigerung wenn die letzte Einheit in einer früheren Woche lag */
function trSuggest(trackId, part) {
  const step = stepOf(part, trStep(trackId, part.id));
  const sets = (step && step.sets) || 1;
  const last = trLastSets(trackId, part.id);
  if (!last.length) {
    // Erste Einheit auf dieser Stufe: Wades Einstiegsmarke vorbelegen, sonst leer lassen.
    // Nie das Stufenziel vorbelegen — das würde den Aufstieg beim ersten Speichern auslösen.
    const entry = step && step.entry;
    if (!entry) return Array.from({ length: sets }, () => null);
    const nEntry = (step && step.entrySets) || sets;
    return Array.from({ length: sets }, (_, i) => i < nEntry ? entry : null);
  }
  const st = trState(trackId);
  const lastD = st.log.filter(l => l.sets && l.sets[part.id]).map(l => l.d).sort().pop();
  const bump = (part.incPerWeek && lastD && weekKeyOf(new Date(lastD + "T12:00:00")) !== weekKeyOf(today0()))
    ? part.incPerWeek : 0;
  return Array.from({ length: sets }, (_, i) =>
    Math.min((step && step.target) || 1e9, Math.max(0, +(last[i] || last[last.length - 1] || 0) + bump)));
}
/* Ist der Nebenteil (z. B. Fingerspitzen) diese Woche schon ausgereizt? */
function partCapLeft(trackId, part, dateK) {
  if (!part.perWeek) return 99;
  const wk = weekKeyOf(new Date(dateK + "T12:00:00"));
  const used = trState(trackId).log.filter(l =>
    weekKeyOf(new Date(l.d + "T12:00:00")) === wk && l.sets && l.sets[part.id]).length;
  return part.perWeek - used;
}
function trLoggedOn(trackId, dateK) { return trState(trackId).log.some(l => l.d === dateK); }

/* ---------- Routing & Views ---------- */
const main = document.getElementById("main");
const titleEl = document.getElementById("title");
const backBtn = document.getElementById("backBtn");
backBtn.onclick = () => { history.back(); };
document.getElementById("navHome").onclick = () => { location.hash = ""; };
document.getElementById("navWeek").onclick = () => { location.hash = "#weeks"; };
document.getElementById("navGo").onclick = () => goContinue();
document.getElementById("navStats").onclick = () => { location.hash = "#stats"; };
document.getElementById("navSet").onclick = () => { location.hash = "#settings"; };
let navScroll = false;
window.addEventListener("hashchange", () => { navScroll = true; if (PROGRAM) render(); });

function setNav(active) {
  document.getElementById("navHome").classList.toggle("active", active === "home");
  document.getElementById("navWeek").classList.toggle("active", active === "week");
  document.getElementById("navStats").classList.toggle("active", active === "stats");
  document.getElementById("navSet").classList.toggle("active", active === "set");
}

function render() {
  const seg = location.hash.replace(/^#/, "").split("/").filter(Boolean);
  const st = window.scrollY;
  if (seg[0] === "settings") renderSettings();
  else if (seg[0] === "stats") renderStats();
  else if (seg[0] === "weeks") renderWeeks();
  else if (seg[0] === "t") renderTrack(seg[1]);
  else if (seg[0] === "d") renderDay(+seg[1], +seg[2], +seg[3]);
  else if (seg[0] === "w") renderWeek(+seg[1], +seg[2]);
  else renderHome();
  // Scroll-Position nur bei echter Navigation zurücksetzen, nicht beim Abhaken
  if (navScroll) { window.scrollTo(0, 0); navScroll = false; }
  else window.scrollTo(0, st);
}

let swapFrom = null;                          // läuft gerade ein Tausch?

function renderPlan() {
  const q = planQueue();
  if (!q.length) {
    return `<div class="today quiet">
      <div class="k">Programm durch</div>
      <div class="v">Alle Einheiten erledigt 🎉</div>
      <div class="s">Der Plan ist ausdrücklich kein Ganzjahresprogramm — erst eine Weile
        gezielt an den Schwächen arbeiten, dann zurückkommen. Einen neuen Durchlauf
        startest du in den Einstellungen.</div>
    </div>`;
  }
  const days = projectPlan(7);
  const first = days[0];
  const extras = planExtras(days);
  let html = "";

  // Zusatz-Zeile(n) für einen projizierten Tag
  const extraRows = e => (extras[e.k] || []).map(id => {
    const tr = trackDef(id); if (!tr) return "";
    const done = trLoggedOn(id, e.k);
    const main = tr.parts[0];
    const lbl = `${tr.name} · Stufe ${trStep(id, main.id)}`;
    const notes = [];
    if (tr.sched && tr.sched.mode === "anchor" && tr.sched.anchor === "lower") notes.push("nach den Kniebeugen");
    (tr.parts || []).forEach(p => { if (p.perWeek && partCapLeft(id, p, e.k) <= 0) notes.push("nur " + main.name); });
    return `<div class="xrow ${done ? "done" : ""}" onclick="event.stopPropagation();location.hash='#t/${id}'">
      ＋ ${esc(lbl)}${done ? " ✓" : ""}${notes.length ? ` <span class="q">· ${esc(notes.join(" · "))}</span>` : ""}
    </div>`;
  }).join("");

  if (swapFrom) {
    const src = planDays().find(d => d.key === swapFrom);
    html += `<div class="swapbar"><span>${esc(src ? dayTitle(src) : "Einheit")} tauschen — zweiten Tag wählen</span>
      <button onclick="planSwapCancel()">abbrechen</button></div>`;
  }

  // Zusatzarbeit hängt nicht an der Plan-Einheit — sie gehört auf die Karte,
  // egal ob heute noch offen, schon erledigt, Ruhetag oder Ausfalltag ist.
  const xBtns = (extras[first.k] || []).map(id => {
    const tr = trackDef(id); if (!tr) return "";
    const done = trLoggedOn(id, first.k);
    return `<button class="cta xcta ${done ? "done" : ""}" onclick="location.hash='#t/${id}'">＋ ${esc(tr.name)} · Stufe ${trStep(id, tr.parts[0].id)}${done ? " ✓" : ""}</button>`;
  }).join("");

  if (first.kind === "train") {
    const istQuelle = swapFrom === first.d.key;
    html += `<div class="today ${istQuelle ? "sel" : ""}">
      <div class="thead">
        <div class="k">Heute · ${WD[first.date.getDay()]} ${esc(fmtDay(first.date))}</div>
        <span class="dots" onclick="planSheet('${first.k}')">⋯</span>
      </div>
      <div class="v">${esc(dayTitle(first.d))}</div>
      <div class="s">${esc(daySub(first.d))}</div>
      ${(swapFrom && !istQuelle)
        ? `<button class="cta" onclick="planSwapWith('${first.d.key}')">Hierher tauschen</button>`
        : `<button class="cta" onclick="location.hash='#d/${first.d.pi}/${first.d.wi}/${first.d.di}'">Training starten</button>`}
      ${xBtns}
    </div>`;
  } else if (first.kind === "donetoday") {
    const nx = days.find(x => x.kind === "train");
    html += `<div class="today quiet">
      <div class="k">Heute · ${WD[first.date.getDay()]} ${esc(fmtDay(first.date))}</div>
      <div class="v">${first.d ? esc(dayTitle(first.d)) + " ✓" : "Erledigt ✓"}</div>
      <div class="s">${nx ? "Als Nächstes: " + esc(dayTitle(nx.d)) : "Weiter geht's demnächst."}</div>
      ${first.d ? `<button class="cta ghost" onclick="location.hash='#d/${first.d.pi}/${first.d.wi}/${first.d.di}'">Einheit ansehen</button>` : ""}
      ${xBtns}
    </div>`;
  } else if (first.kind === "off") {
    html += `<div class="today quiet">
      <div class="k">Heute · ${WD[first.date.getDay()]} ${esc(fmtDay(first.date))}</div>
      <div class="v">Geht nicht</div>
      <div class="s">Als Ausfalltag markiert — alles rutscht nach hinten.</div>
      <button class="cta ghost" onclick="planOffToggle('${first.k}')">Doch, geht</button>
      ${xBtns}
    </div>`;
  } else if (first.kind === "rest") {
    html += `<div class="today quiet">
      <div class="k">Heute · ${WD[first.date.getDay()]} ${esc(fmtDay(first.date))}</div>
      <div class="v">Ruhetag</div>
      <div class="s">${MAX_STREAK} Trainingstage am Stück sind genug.</div>
      <button class="cta ghost" onclick="planForce('${first.k}')">Trotzdem trainieren</button>
      ${xBtns}
    </div>`;
  }

  html += `<h2 class="section">Danach</h2>`;
  days.slice(1).forEach(e => {
    const wd = `<div class="dt"><div class="wd">${WD[e.date.getDay()]}</div><div class="dn">${e.date.getDate()}.</div></div>`;
    html += `<div class="pdw">`;
    if (e.kind === "train") {
      const sel = swapFrom === e.d.key;
      const click = swapFrom ? `planSwapWith('${e.d.key}')` : `location.hash='#d/${e.d.pi}/${e.d.wi}/${e.d.di}'`;
      const nSess = e.d.day.sessions.filter(s => s.items.some(i => !i.rest)).length;
      html += `<div class="pd ${sel ? "sel" : ""}" onclick="${click}">${wd}
        <div class="inf"><div class="t">${esc(dayTitle(e.d))}</div><div class="s">${esc(daySub(e.d))}</div></div>
        ${nSess > 1 ? `<span class="tag">${nSess}×</span>` : ""}
        <span class="dots" onclick="event.stopPropagation();planSheet('${e.k}')">⋯</span>
      </div>`;
    } else if (e.kind === "off") {
      html += `<div class="pd muted off" onclick="planOffToggle('${e.k}')">${wd}
        <div class="inf"><div class="t">Geht nicht</div><div class="s">antippen zum Zurücknehmen</div></div>
        <span class="dots">↺</span></div>`;
    } else if (e.kind === "rest") {
      html += `<div class="pd muted" onclick="planForce('${e.k}')">${wd}
        <div class="inf"><div class="t">Ruhetag</div><div class="s">${MAX_STREAK} Tage am Stück wären zu viel</div></div>
      </div>`;
    } else {
      html += `<div class="pd muted">${wd}
        <div class="inf"><div class="t">frei</div><div class="s">Programm durch</div></div></div>`;
    }
    html += extraRows(e) + `</div>`;
  });

  // Ruhetag entfällt, wenn ohnehin eine Lücke im Fenster liegt — kurz erklären.
  if (days.some(e => e.kind === "off") && !days.some(e => e.kind === "rest")) {
    html += `<div class="planhint">Kein extra Ruhetag nötig — die Lücke zählt bereits als Pause.</div>`;
  }

  const wkNow = dkey(today0());
  const trSum = (TRACKS || []).map(tr =>
    `${esc(tr.name)} ${trDoneInWeek(tr.id, wkNow)} von ${(tr.sched || {}).perWeek || 2}`).join(" · ");
  if (trSum) html += `<div class="planfoot" style="margin-top:12px">Diese Woche · ${trSum}</div>`;

  const end = planEnd();
  html += `<div class="planfoot" style="margin-top:6px">${end
    ? "Ende vorauss. " + esc(end.date.toLocaleDateString("de-DE", { day: "numeric", month: "short" })) + " · "
    : ""}noch ${q.length} Einheiten</div>`;
  return html;
}

function renderHome() {
  backBtn.style.display = "none";
  titleEl.textContent = PLAN_TITLE;
  setNav("home");
  const total = FLAT.length, done = FLAT.filter(f => S.checked[f.item.id]).length;
  const p = pct(done, total);

function goContinue() {
  // folgt der Planung (Tausche/Streichungen), nicht stur der Plan-Reihenfolge
  const q = planQueue();
  const day = q[0];
  if (!day) { alert("Alles erledigt! 🎉"); return; }
  const item = day.items.find(i => !S.checked[i.id]) || day.items[0];
  const next = { pi: day.pi, wi: day.wi, di: day.di, item };
  location.hash = `#d/${next.pi}/${next.wi}/${next.di}`;
  setTimeout(() => {
    const el = document.getElementById("it-" + next.item.id);
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("flash"); }
  }, 120);
}

function renderTrack(id) {
  const tr = trackDef(id);
  if (!tr) { location.hash = ""; return; }
  backBtn.style.display = "";
  titleEl.textContent = tr.name;
  setNav("home");
  const st = trState(id);

      if (pre.length) html += `<div class="tnote">${pre.join("<br>")}</div>`;

        }
      } else {
        html += `<div class="setrow">
          <span class="lbl">Wdh.</span>

        </div>`;
      }
      if (part.note) html += `<div class="tnote q">${esc(part.note)}</div>`;
    }
  });

  html += `<button class="tsave" onclick="trSave('${id}')">Einheit speichern</button>`;

  // Stufe von Hand setzen (Einstieg / Korrektur)
  html += `<h2 class="section">Stufe setzen</h2>`;
  (tr.parts || []).forEach(part => {
    html += `<div class="setrow"><span class="lbl" style="width:auto;flex:1">${esc(part.name)}</span>
      <select onchange="trSetStep('${id}','${part.id}',this.value)">
        ${(part.steps || []).map(s => `<option value="${s.n}" ${s.n === trStep(id, part.id) ? "selected" : ""}>Stufe ${s.n} — ${esc(s.name)}</option>`).join("")}
      </select></div>`;
  });

  // Verlauf
  if (st.log.length) {
    html += `<h2 class="section">Verlauf</h2>`;
    const recent = st.log.slice(-12).reverse();
    recent.forEach(l => {
      const cols = (tr.parts || []).map(p => {
        const v = l.sets && l.sets[p.id];
        if (!v) return "";
        const unit = p.unit === "s" ? " s" : "";
        return `<span class="vals">${v.join(" · ")}${unit}</span>`;

      html += `<div class="lrow"><span class="q">${esc(fmtDate(l.d + "T12:00:00"))}</span>${cols}</div>`;

      .slice(-10).map(l => Math.max.apply(null, l.sets[mainPart.id].map(Number)));

  if (st.hist.length) {
    html += `<div class="tnote q" style="margin-top:14px">` + st.hist.slice(-6).reverse().map(h => {

/* "85x6" -> {w:85, r:6}. Toleriert Komma und Leerzeichen; null wenn unlesbar. */
function parseSet(v) {
  const m = String(v || "").replace(",", ".").match(/(\d+(?:\.\d+)?)\s*[x\u00d7]\s*(\d+)/i);
  return m ? { w: parseFloat(m[1]), r: parseInt(m[2], 10) } : null;
}
/* Sollwiederholungen aus dem Übungsnamen ("Bench Press 2x8" -> 8) */
function targetReps(ex) {
  const m = String(ex.name || "").match(/(\d+)\s*[x\u00d7]\s*(\d+)/i);
  return m ? parseInt(m[2], 10) : null;
}
/* Rampe = mehrere Prozentwerte -> der SCHWERSTE Satz zählt, sonst der schwächste */
function isRamp(ex) { return (ex.pct || []).length > 1; }
function isRmEx(ex) { return !!(ex.rm && ex.pct && ex.pct.length); }
/* 1RM-Stand zu einem Zeitpunkt — damit alte Einträge gegen die Vorgabe von
   DAMALS bewertet werden und nicht rückwirkend als verfehlt gelten. */
function rmAt(k, iso) {
  let v = null;
  (S.rmLog || []).forEach(e => { if (e.k === k && e.value != null && (!iso || e.t <= iso)) v = e.value; });
  return v != null ? v : parseFloat((S.oneRM || {})[k]);
}
/* Wann wurde dieser Eintrag gespeichert? */
function resultDate(exKey, rid) {
  const e = (S.results[exKey] || []).find(x => x.itemId === rid && (x.run || 1) === (S.run || 1));
  return e ? e.date : null;
}
/* Vorgegebenes Spitzengewicht dieser Übung (optional zum Zeitpunkt iso) */
function targetWeight(ex, iso) {
  const base = iso ? rmAt(ex.rm, iso) : parseFloat((S.oneRM || {})[ex.rm]);
  if (!base || !ex.pct || !ex.pct.length) return null;
  return mround25(base * Math.max.apply(null, ex.pct));
}

function renderExercise(item, ex) {
  const rid = item.id + "/" + ex.k;
  const val = S.resultsByItem[rid] || "";
  const last = lastResult(ex.k, rid);
  let h = `<div class="ex">`;
  if (isRmEx(ex)) {
    const cur = parseSet(val);
    const tw = targetWeight(ex, resultDate(ex.k, rid)), tr = targetReps(ex);
    const geschafft = cur && tw != null && cur.w >= tw && (tr == null || cur.r >= tr);
    h += `<div class="exrow"><div class="exname">${esc(ex.name)}</div>
      ${cur ? `<span class="exok ${geschafft ? "yes" : "no"}">${geschafft ? "✓" : "–"}</span>` : ""}</div>
      <div class="exset">
        <span class="sl">${isRamp(ex) ? "Schwerster" : "Schwächster"} Satz</span>
        <input class="exn" type="number" inputmode="decimal" step="2.5" placeholder="kg"
          id="exw-${rid}" value="${cur ? cur.w : ""}" onchange="setExSet('${rid}','${ex.k}')">
        <span class="su">kg ×</span>
        <input class="exn" type="number" inputmode="numeric" placeholder="Wdh."
          id="exr-${rid}" value="${cur ? cur.r : ""}" onchange="setExSet('${rid}','${ex.k}')">
      </div>`;
    if (val && !cur) h += `<div class="exnote">bisher eingetragen: ${esc(val)}</div>`;
  } else {
    h += `<div class="exrow">
      <div class="exname">${esc(ex.name)}</div>
      <input class="exw" type="text" placeholder="Gewicht" value="${esc(val)}"
        onchange="setResult('${rid}','${ex.k}',this.value)">
    </div>`;
  }
  const pre = prescription(ex);
  if (pre) h += `<div class="expre">Vorgabe: ${esc(pre)}</div>`;
  if (ex.note) h += `<div class="exnote">${esc(ex.note)}</div>`;
  if (last && !val) h += `<button class="exlast" onclick="fillResult('${rid}','${ex.k}','${esc(last.value).replace(/'/g, "\\'")}')">Letztes Mal: ${esc(last.value)} · ${fmtDate(last.date)} — übernehmen</button>`;
  return h + `</div>`;
}

function renderExercises(item) {
  if (!item.exercises || !item.exercises.length) return "";
  const gs = exGroups(item);
  if (gs.length < 2) {
    return `<div class="exs">` + item.exercises.map(ex => renderExercise(item, ex)).join("") + `</div>`;
  }
  return `<div class="exs">` + gs.map(g => {

    return `<div class="ghead ${done ? "done" : ""}">

  }).join("") + `</div>`;
}

function renderResult(item) {
  const val = S.resultsByItem[item.id] || "";
  const last = lastResult(item.key, item.id);

  if (last && !val) {
    html += `<div class="last"><button onclick="fillResult('${item.id}','${item.key}','${esc(last.value).replace(/'/g, "\\'")}')">

  if (hist.length) {
    html += `<details><summary>Verlauf</summary>${hist.map(e => `${fmtDate(e.date)}: ${esc(e.value)}`).join("<br>")}</details>`;
  }
  return html + `</div>`;
}

/* ---------- Actions ---------- */
function setItemChecked(id, on, now) {
  const item = ITEM_INDEX[id];
  const gs = item && item.exercises ? exGroups(item) : [];
  if (on) {
    if (!S.checked[id]) { S.checked[id] = now; logEv("done", id); }
    gs.forEach(g => { S.checked[g.id] = now; });
  } else {
    if (S.checked[id]) { delete S.checked[id]; logEv("undone", id); }
    gs.forEach(g => delete S.checked[g.id]);
  }
}
window.toggle = function (id) {
  setItemChecked(id, !S.checked[id], new Date().toISOString());
  markDirty();
  render();
};
window.toggleGroup = function (gid, itemId) {
  const now = new Date().toISOString();
  if (S.checked[gid]) { delete S.checked[gid]; logEv("undone", gid); }
  else { S.checked[gid] = now; logEv("done", gid); }
  const gs = exGroups(ITEM_INDEX[itemId]);
  const all = gs.every(g => S.checked[g.id]);
  if (all && !S.checked[itemId]) { S.checked[itemId] = now; logEv("done", itemId); }
  if (!all && S.checked[itemId]) delete S.checked[itemId];
  markDirty();
  render();
};
window.checkSession = function (pi, wi, di, si) {
  const sess = PROGRAM[pi].weeks[wi].days[di].sessions[si];
  const items = sess.items.filter(i => !i.rest);
  const allDone = items.every(i => S.checked[i.id]);
  const now = new Date().toISOString();
  items.forEach(i => setItemChecked(i.id, !allDone, now));
  markDirty();
  render();
};
window.setResult = function (id, key, value) {
  value = (value || "").trim();
  if (value) S.resultsByItem[id] = value; else delete S.resultsByItem[id];
  const arr = (S.results[key] = S.results[key] || []);
  // Nur den Eintrag des AKTUELLEN Durchlaufs ersetzen — Historie früherer Durchläufe bleibt
  const idx = arr.findIndex(e => e.itemId === id && (e.run || 1) === (S.run || 1));
  if (idx >= 0) arr.splice(idx, 1);
  if (value) { arr.push({ value, date: new Date().toISOString(), itemId: id, run: S.run || 1 }); logEv("weight", id, { k: key, value }); }
  markDirty();
  render();
};
window.fillResult = function (id, key, value) { window.setResult(id, key, value); };
