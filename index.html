/* ---------- Analyse ---------- */
function parseW(v) { const m = String(v).replace(",", ".").match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }
function trainingDates() {
  const set = new Set();
  Object.values(S.checked).forEach(t => { if (typeof t === "string") set.add(t.slice(0, 10)); });
  (S.log || []).forEach(e => { if (e.e === "done" && e.t) set.add(e.t.slice(0, 10)); });
  return [...set].sort();
}
function spark(pts) {
  if (!pts || pts.length < 2) return `<div class="sparkempty">noch zu wenig Daten</div>`;
  const W = 120, H = 34, pad = 4;
  const min = Math.min(...pts), max = Math.max(...pts), span = (max - min) || 1;
  const x = i => pad + i * (W - 2 * pad) / (pts.length - 1);
  const y = v => H - pad - (v - min) * (H - 2 * pad) / span;
  const line = pts.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <polyline points="${line}" fill="none" stroke="var(--lime)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(pts[pts.length - 1]).toFixed(1)}" r="3.2" fill="var(--lime)"/>
  </svg>`;
}
function weekBars(weeks) {
  const W = 348, H = 112, slot = W / weeks.length, bw = Math.min(20, slot - 6);
  const base = 86, top = 16;
  const max = Math.max(...weeks.map(w => w.count), 1);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  weeks.forEach((w, i) => {
    const h = w.count === 0 ? 2 : (w.count / max) * (base - top);
    const x = i * slot + (slot - bw) / 2, y = base - h;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3"
      fill="${w.count === 0 ? "rgba(255,255,255,.08)" : "var(--lime)"}"><title>${w.count} Trainingstage</title></rect>`;
    if (w.count > 0) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#c9cfda">${w.count}</text>`;
    if (i % 4 === 0 || i === weeks.length - 1) {
      const d = w.start;
      s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="#8b93a3">${d.getDate()}.${d.getMonth() + 1}.</text>`;
    }
  });
  s += `<line x1="0" y1="${base + 1}" x2="${W}" y2="${base + 1}" stroke="rgba(255,255,255,.12)"/>`;
  return s + `</svg>`;
}
function renderStats() {
  backBtn.style.display = "none";
  titleEl.textContent = "Analyse";
  setNav("stats");
  const dates = trainingDates();
  const total = FLAT.length, done = FLAT.filter(f => S.checked[f.item.id]).length;
  const p = pct(done, total);

  // Wochen-Buckets (Mo–So), letzte 12 Wochen
  const monday = new Date(); monday.setHours(12, 0, 0, 0);
  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const start = new Date(monday); start.setDate(start.getDate() - i * 7);
    const end = new Date(start); end.setDate(end.getDate() + 7);
    const a = start.toISOString().slice(0, 10), b = end.toISOString().slice(0, 10);
    weeks.push({ start, count: dates.filter(d => d >= a && d < b).length });
  }
  const thisWeek = weeks[11].count;
  let streak = 0;
  for (let i = 11; i >= 0; i--) {
    if (weeks[i].count > 0) streak++;
    else if (i === 11) continue;
    else break;
  }
  const nWeights = (S.log || []).filter(e => e.e === "weight").length;

  let motto;
  if (streak >= 3) motto = `🔥 ${streak} Wochen am Stück im Training — Maschine!`;
  else if (thisWeek >= 3) motto = `💪 Schon ${thisWeek} Trainingstage diese Woche!`;
  else if (dates.length > 0) motto = `${dates.length} Trainingstage absolviert — dranbleiben!`;
  else motto = `Zeit, die Maschine anzuwerfen 🚀`;
  if ((S.run || 1) > 1) motto = `Durchlauf ${S.run} · ` + motto;

  let html = `
    <div class="motto">${esc(motto)}</div>`;

  // Durchläufe im Vergleich
  const runs = S.runs || [];
  if (runs.length) {
    html += `<div class="chartcard" style="margin-bottom:12px"><h3>🔁 Deine Durchläufe</h3>`
      + runs.map(r => `<div class="ts"><span>Durchlauf ${r.no} · ${fmtDate(r.startedAt)} – ${fmtDate(r.endedAt)}</span><span>${r.done}/${r.total} Parts</span></div>`).join("")
      + `<div class="ts"><span>Durchlauf ${S.run || 1} · läuft</span><span>${done}/${total} Parts (${p}%)</span></div></div>`;
  }

  // Stufenleitern — Stand auf einen Blick
  if ((TRACKS || []).length) {
    html += `<div class="chartcard" style="margin-bottom:12px"><h3>Stufen</h3>`
      + TRACKS.map(tr => (tr.parts || []).map(part => {
        const cur = trStep(tr.id, part.id), pr = trProgress(tr.id, part);
        const rest = pr ? (pr.reached ? "Ziel erreicht" : (pr.last.length ? "noch " + pr.missing + (part.unit === "s" ? " s" : " Wdh.") : "offen")) : "nach Gefühl";
        return `<div class="ts"><span>${esc(tr.name)} · ${esc(part.name)}</span>
          <span><a href="#t/${tr.id}" style="color:var(--sky);text-decoration:none">Stufe ${cur} · ${esc(rest)}</a></span></div>`;
      }).join("")).join("")
      + `</div>`;
  }

  // Gestrichene Einheiten — damit der Durchlauf-Vergleich nicht lügt
  const dropped = planState().dropped;
  if (dropped.length) {
    const byKey = {};
    planDays().forEach(d => { byKey[d.key] = d; });
    html += `<div class="chartcard" style="margin-bottom:12px"><h3>✕ Gestrichen · ${dropped.length}</h3>`
      + dropped.map(k => byKey[k]
        ? `<div class="ts"><span>${esc(byKey[k].part.name)} · ${esc(dayTitle(byKey[k]))}</span>
             <span><button class="exlast" style="margin:0" onclick="planUndrop('${k}')">zurückholen</button></span></div>`
        : "").join("")
      + `</div>`;
  }

  html += `
    <div class="stats">
      <div class="stat"><b>${dates.length}</b><span>Trainingstage gesamt</span></div>
      <div class="stat"><b>${streak}</b><span>Wochen-Streak</span></div>
      <div class="stat"><b>${thisWeek}</b><span>Tage diese Woche</span></div>
      <div class="stat"><b>${p}%</b><span>Programm geschafft</span></div>
    </div>
    <div class="chartcard">
      <h3>Trainingstage pro Woche · letzte 12 Wochen</h3>
      ${weekBars(weeks)}
    </div>`;

  // Kraftentwicklung 1RM
  const rmlog = S.rmLog || [];
  const liftCards = RM_KEYS.map(([k, label]) => {
    const cur = (S.oneRM || {})[k];
    const entries = rmlog.filter(e => e.k === k && e.value != null).map(e => e.value);
    if (cur == null && !entries.length) return "";
    const pts = entries.slice();
    if (cur != null && (!pts.length || pts[pts.length - 1] !== cur)) pts.push(cur);
    const first = pts[0], delta = (cur ?? first) - first;
    const chip = delta > 0 ? `<span class="chip up">+${fmtW(delta)} kg</span>`
      : delta < 0 ? `<span class="chip down">−${fmtW(Math.abs(delta))} kg</span>`
      : `<span class="chip flat">±0</span>`;
    return `<div class="lift">
      <div class="ln">${esc(label.replace(/\s*\(.*/, ""))}</div>
      <div class="lv">${cur != null ? fmtW(cur) + " kg" : "—"}</div>
      ${chip}
      ${spark(pts)}
    </div>`;
  }).join("");
  if (liftCards) html += `<h2 class="section">Kraftentwicklung · <em>1RM</em></h2><div class="liftgrid">${liftCards}</div>`;

  // Top-Set-Trends aus tatsächlich eingetragenen Gewichten
  const keyLabel = {};
  PROGRAM.forEach(pp => pp.weeks.forEach(w => w.days.forEach(d => d.sessions.forEach(s => s.items.forEach(i =>
    (i.exercises || []).forEach(ex => { if (ex.rm && !keyLabel[ex.k]) keyLabel[ex.k] = ex.name; }))))));
  const rows = Object.keys(keyLabel).map(k => {
    const byRun = {};
    (S.results[k] || []).forEach(h => {
      const n = parseW(h.value);
      if (n != null) (byRun[h.run || 1] = byRun[h.run || 1] || []).push(n);
    });
    const runNos = Object.keys(byRun).map(Number).sort((a, b) => a - b);
    if (!runNos.length) return "";
    let val, d;
    if (runNos.length > 1) {
      // Vergleich über Durchläufe: letzter Wert je Durchlauf
      const lasts = runNos.map(r => byRun[r][byRun[r].length - 1]);
      val = runNos.map((r, i) => `R${r}: ${fmtW(lasts[i])}`).join(" · ") + " kg";
      d = lasts[lasts.length - 1] - lasts[0];
    } else {
      const ws = byRun[runNos[0]];
      val = ws.length < 2 ? `${fmtW(ws[0])} kg` : `${fmtW(ws[0])} → ${fmtW(ws[ws.length - 1])} kg`;
      d = ws.length < 2 ? 0 : ws[ws.length - 1] - ws[0];
    }
    const trend = d > 0 ? ` <span class="chip up">+${fmtW(d)}</span>` : d < 0 ? ` <span class="chip down">−${fmtW(Math.abs(d))}</span>` : (runNos.length > 1 || (byRun[runNos[0]] || []).length > 1) ? ` <span class="chip flat">±0</span>` : "";
    return `<div class="ts"><span>${esc(keyLabel[k])}</span><span>${val}${trend}</span></div>`;
  }).filter(Boolean).join("");
  if (rows) html += `<div class="chartcard" style="margin-top:16px"><h3>Deine Arbeitsgewichte${(S.runs || []).length ? " · Vergleich der Durchläufe" : " · erstes → letztes Training"}</h3>${rows}</div>`;

  html += `<div class="stats" style="margin-top:16px">
      <div class="stat"><b>${done}</b><span>Parts erledigt</span></div>
      <div class="stat"><b>${nWeights}</b><span>Gewichte geloggt</span></div>
    </div>
    <div class="foot">Datenquellen: Trainingslog, 1RM-Verlauf, Gewichts-Einträge</div>`;
  main.innerHTML = html;
}

/* ---------- Steigerung der schweren Lifts ----------
   Eine Einheit = alle Übungen desselben Lifts an EINEM Plan-Tag. Erst wenn
   jede davon Gewicht und Wiederholungen erreicht, wird eine Steigerung
   angeboten. Der 1RM-Sprung wird rückwärts aus der 2,5-kg-Rundung gerechnet:
   der kleinste Wert, der JEDE Übung der Gruppe um eine Rasterstufe hebt.     */
function liftGroup(itemId, rmKey) {
  const base = String(itemId).split("/")[0];
  const f = FLAT.find(x => x.item.id === base);
  if (!f) return [];
  const day = PROGRAM[f.pi].weeks[f.wi].days[f.di];
  const out = [];
  day.sessions.forEach(s => s.items.forEach(it => (it.exercises || []).forEach(ex => {
    if (ex.rm === rmKey && isRmEx(ex)) out.push({ item: it, ex: ex });
  })));
  return out;
}
function exAchieved(it, ex) {
  const rid = it.id + "/" + ex.k;
  const cur = parseSet(S.resultsByItem[rid]);
  const tw = targetWeight(ex, resultDate(ex.k, rid)), tr = targetReps(ex);
  if (!cur || tw == null) return null;                 // nichts eingetragen -> unbekannt
  return cur.w >= tw && (tr == null || cur.r >= tr);
}
/* Kleinster 1RM (0,5-kg-Schritte), der jede Übung der Gruppe um >=2,5 kg hebt */
function nextRM(group, dir) {
  const k = group[0].ex.rm;
  const base = parseFloat((S.oneRM || {})[k]);
  if (!base) return null;
  const soll = group.map(g => mround25(base * Math.max.apply(null, g.ex.pct)));
  const step = dir < 0 ? -0.5 : 0.5;
  let r = base;
  for (let i = 0; i < 200; i++) {
    r = Math.round((r + step) * 2) / 2;
    if (r <= 0) return null;
    const ok = group.every((g, j) => {
      const w = mround25(r * Math.max.apply(null, g.ex.pct));
      return dir < 0 ? w <= soll[j] - 2.5 : w >= soll[j] + 2.5;
    });
    if (ok) return r;
  }
  return null;
}
/* Wie oft wurde dieser Lift zuletzt hintereinander verfehlt? (abgeleitet, kein Zustand) */
function missStreak(rmKey) {
  const tage = [];
  PROGRAM.forEach((part, pi) => part.weeks.forEach((week, wi) => week.days.forEach((day, di) => {
    const exs = [];
    day.sessions.forEach(s => s.items.forEach(it => (it.exercises || []).forEach(ex => {
      if (ex.rm === rmKey && isRmEx(ex)) exs.push({ item: it, ex: ex });
    })));
    if (exs.length) tage.push(exs);
  })));
  // Für die Senkung zählt nur der SCHWERSTE Satz des Tages. Eine verfehlte
  // Wiederholung im Rückwärtssatz sagt nichts über den 1RM aus — nach oben
  // muss dagegen die ganze Gruppe sitzen (asymmetrisch, absichtlich).
  let streak = 0;
  for (let i = tage.length - 1; i >= 0; i--) {
    const top = tage[i].slice().sort((a, b) =>
      Math.max.apply(null, b.ex.pct) - Math.max.apply(null, a.ex.pct))[0];
    const res = exAchieved(top.item, top.ex);
    if (res === null) continue;                        // Tag noch nicht bearbeitet
    if (res === false) streak++; else break;
  }
  return streak;
}
window.setExSet = function (rid, key) {
  const w = parseFloat(String((document.getElementById("exw-" + rid) || {}).value || "").replace(",", "."));
  const r = parseInt(String((document.getElementById("exr-" + rid) || {}).value || ""), 10);
  const val = (isFinite(w) && w > 0 && isFinite(r) && r > 0) ? fmtW(w) + "x" + r : "";
  setResult(rid, key, val.replace(",", "."));          // Speicherformat bleibt "85x6"
  if (!val) return;

  const base = String(rid).split("/")[0];
  const f = FLAT.find(x => x.item.id === base);
  const ex = (ITEM_INDEX[base] && (ITEM_INDEX[base].exercises || []).find(e => e.k === key)) || null;
  if (!f || !ex || !isRmEx(ex)) return;

  const group = liftGroup(base, ex.rm);
  const res = group.map(g => exAchieved(g.item, g.ex));
  const label = (RM_KEYS.find(x => x[0] === ex.rm) || [ex.rm, ex.rm])[1].replace(/\s*\(.*/, "");

  if (res.every(x => x === true)) {
    const rn = nextRM(group, +1);
    if (rn == null) return;
    const alt = S.oneRM[ex.rm];
    const zeilen = group.map(g => {
      const top = Math.max.apply(null, g.ex.pct);
      return `${g.ex.name}: ${fmtW(mround25(alt * top))} → ${fmtW(mround25(rn * top))} kg`;
    }).join("\n");
    if (confirm(`${label} komplett geschafft.\n\n1RM von ${fmtW(alt)} auf ${fmtW(rn)} kg anheben?\n\nNächstes Mal:\n${zeilen}`)) {
      setRM(ex.rm, rn);
      render();
    }
    return;
  }
  // Gegenrichtung: zweimal hintereinander verfehlt -> Senken anbieten
  if (res.some(x => x === false) && res.every(x => x !== null) && missStreak(ex.rm) >= 2) {
    const rn = nextRM(group, -1);
    if (rn == null) return;
    const alt = S.oneRM[ex.rm];
    if (confirm(`${label} zum zweiten Mal hintereinander verfehlt.\n\n1RM von ${fmtW(alt)} auf ${fmtW(rn)} kg senken, damit die Vorgaben wieder treffbar sind?`)) {
      setRM(ex.rm, rn);
      render();
    }
  }
};

window.setRM = function (k, v) {
  v = parseFloat(String(v).trim().replace(",", "."));
  S.oneRM = S.oneRM || {};
  const old = S.oneRM[k];
  if (v > 0) S.oneRM[k] = v; else delete S.oneRM[k];
  if ((v > 0 ? v : null) !== (old ?? null)) {
    (S.rmLog = S.rmLog || []).push({ t: new Date().toISOString(), k, value: v > 0 ? v : null });
  }
  markDirty();
};
function fillDiag() {
  const el = document.getElementById("diag");
  if (!el) return;
  const nav = document.querySelector("nav");
  const probe = document.createElement("div");
  probe.style.cssText = "position:fixed;bottom:0;height:env(safe-area-inset-bottom);width:0";
  document.body.appendChild(probe);
  const safe = Math.round(probe.getBoundingClientRect().height);
  probe.remove();
  const b = nav.getBoundingClientRect();

  el.textContent = `Modus: ${standalone ? "Homescreen-App" : "Browser"} · Fenster: ${Math.round(window.innerWidth)}×${Math.round(window.innerHeight)} px`
    + ` · Bildschirm: ${screen.width}×${screen.height} · Seite: ${document.documentElement.scrollHeight} px`
    + ` · Safe-Area unten: ${safe} px`
    + ` · Leiste endet bei: ${Math.round(b.bottom)} px (Lücke: ${Math.round(window.innerHeight - b.bottom)} px)`;
}
/* ---------- Stufenleitern: Aktionen ---------- */
window.trSave = function (id) {
  const tr = trackDef(id); if (!tr) return;
  const todayK = dkey(today0());
  const sets = {}, steps = {};
  (tr.parts || []).forEach(part => {
    if (partCapLeft(id, part, todayK) <= 0) return;
    const n = part.gate === "numeric" ? ((stepOf(part, trStep(id, part.id)) || {}).sets || 1) : 1;
    const vals = [];
    for (let i = 0; i < n; i++) {
      const el = document.getElementById(`tin-${id}-${part.id}-${i}`);
      const v = el ? parseFloat(el.value) : NaN;
      vals.push(isFinite(v) && v > 0 ? v : 0);
    }
    if (vals.some(v => v > 0)) { sets[part.id] = vals; steps[part.id] = trStep(id, part.id); }
  });
  if (!Object.keys(sets).length) { alert("Nichts eingetragen."); return; }

  const st = trState(id);
  const existing = st.log.findIndex(l => l.d === todayK);
  const entry = { d: todayK, sets: sets, steps: steps };
  if (existing >= 0) {
    // Heutige Einheit ergänzen statt doppelt anlegen
    const old = st.log[existing];
    entry.sets = Object.assign({}, old.sets || {}, sets);
    entry.steps = Object.assign({}, old.steps || {}, steps);
    st.log[existing] = entry;
  } else st.log.push(entry);
  st.log.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
  logEv("track", id + "/" + Object.keys(sets).join("+"));
  markDirty();

  // Stufenziel erreicht? -> anbieten, nicht automatisch aufsteigen.
  // Bewertet werden die eben eingetragenen Werte, nicht ein Umweg über das Log.
  (tr.parts || []).forEach(part => {
    if (part.gate !== "numeric" || !sets[part.id]) return;
    const step = stepOf(part, trStep(id, part.id));
    const need = (step && step.sets) || 1, tgt = (step && step.target) || 1;
    const vals = sets[part.id];
    const reached = vals.length >= need && vals.slice(0, need).every(v => +v >= tgt);
    if (reached && trStep(id, part.id) < (part.steps || []).length) {
      const nxt = stepOf(part, trStep(id, part.id) + 1);
      if (confirm(`${part.name}: Ziel der Stufe ${trStep(id, part.id)} geschafft.\n\nAuf Stufe ${nxt.n} — ${nxt.name} — wechseln?`))
        trAdvance(id, part.id, trStep(id, part.id) + 1);
    }
  });
  render();
};
function trAdvance(id, partId, to) {
  const st = trState(id), from = trStep(id, partId);
  st.steps[partId] = to;
  st.hist.push({ p: partId, from: from, to: to, d: dkey(today0()) });
  markDirty();
}
window.trSetStep = function (id, partId, val) {
  const to = parseInt(val, 10);
  if (!isFinite(to) || to === trStep(id, partId)) return;
  trAdvance(id, partId, to);
  render();
};

  const e = projectPlan(7).find(x => x.k === dateKey);
  if (!e || e.kind !== "train") return;
  const wrap = document.createElement("div");
  wrap.className = "sheetwrap";
  wrap.onclick = ev => { if (ev.target === wrap) closeSheet(); };
  wrap.innerHTML = `<div class="sheet">
    <h4>${WD[e.date.getDay()]} ${esc(fmtDay(e.date))}</h4>
    <p>${esc(dayTitle(e.d))} — ${esc(daySub(e.d))}</p>

    <button onclick="planDrop('${e.d.key}')">Einheit streichen<small>Fällt dauerhaft weg, erscheint in der Analyse als gestrichen.</small></button>

  </div>`;
  document.body.appendChild(wrap);
};
window.closeSheet = function () { const w = document.querySelector(".sheetwrap"); if (w) w.remove(); };
window.planOffToggle = function (k) {
  const P = planState(), i = P.off.indexOf(k);
  if (i >= 0) P.off.splice(i, 1);
  else {
    P.off.push(k); P.off.sort();
    const j = P.force.indexOf(k); if (j >= 0) P.force.splice(j, 1);
  }
  closeSheet(); markDirty(); render();
};
window.planForce = function (k) {
  const P = planState();
  if (P.force.indexOf(k) < 0) P.force.push(k);
  const j = P.off.indexOf(k); if (j >= 0) P.off.splice(j, 1);
  closeSheet(); markDirty(); render();
};
window.planSwapStart = function (dayKey) { swapFrom = dayKey; closeSheet(); render(); };
window.planSwapCancel = function () { swapFrom = null; render(); };
window.planSwapWith = function (dayKey) {
  if (!swapFrom || dayKey === swapFrom) { swapFrom = null; render(); return; }
  planState().swaps.push([swapFrom, dayKey]);
  swapFrom = null; markDirty(); render();
};
window.planDrop = function (dayKey) {
  const d = planDays().find(x => x.key === dayKey);
  if (!d) return;
  closeSheet();
  if (!confirm(`„${dayTitle(d)}" streichen?\n\nDie Einheit fällt dauerhaft weg. In der Analyse erscheint sie als gestrichen — zurückholen kannst du sie dort jederzeit.`)) return;
  planState().dropped.push(dayKey);
  logEv("drop", d.items[0].id);
  markDirty(); render();
};
window.planUndrop = function (dayKey) {
  const P = planState(), i = P.dropped.indexOf(dayKey);
  if (i >= 0) P.dropped.splice(i, 1);
  markDirty(); render();
};

window.startNewRun = function () {
  const runNo = S.run || 1;
  const done = FLAT.filter(f => S.checked[f.item.id]).length;
  if (!confirm(`Durchlauf ${runNo} abschließen (${done}/${FLAT.length} Parts) und mit Durchlauf ${runNo + 1} von vorne starten?\n\nGewichts-Historie, 1RM und Trainingslog bleiben erhalten — die Analyse zeigt künftig den Vergleich.`)) return;
  const now = new Date().toISOString();
  const times = Object.values(S.checked).filter(t => typeof t === "string").sort();
  (S.runs = S.runs || []).push({
    no: runNo,
    startedAt: times[0] || now,
    endedAt: now,
    done,
    total: FLAT.length,
    checked: S.checked,
    resultsByItem: S.resultsByItem
  });
  S.run = runNo + 1;
  S.checked = {};
  S.resultsByItem = {};
  S.plan = { off: [], force: [], dropped: [], swaps: [] };   // Planung gehört zum Durchlauf
  logEv("run-start", "run-" + S.run);
  markDirty();
  location.hash = "";
  render();
};
window.doReset = function () {
  if (confirm("Wirklich ALLEN Fortschritt und alle Ergebnisse löschen? (1RM-Gewichte, Trainingslog und Durchläufe bleiben erhalten)")) {
    S = { checked: {}, resultsByItem: {}, results: {}, oneRM: S.oneRM, rmLog: S.rmLog, log: S.log, runs: S.runs, run: S.run, tracks: S.tracks };
    markDirty();
    location.hash = "";
    render();
  }
};

boot();
</script>
